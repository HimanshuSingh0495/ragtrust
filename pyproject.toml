[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtrust"
version = "0.1.0"
description = "Eval-gated retrieval primitives for RAG pipelines: similarity gates, abstention, citation checks, incremental ingestion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Himanshu Singh" }]
keywords = ["rag", "retrieval", "eval", "llm", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Bring your own real embedder; the bundled default is stdlib-only.
embed = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
ragtrust = "ragtrust.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragtrust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/HimanshuSingh0495/ragtrust"
